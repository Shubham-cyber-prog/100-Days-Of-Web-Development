<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Rooms | 100 Days of Web Dev</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    /* ================= GLOBAL ================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
    }

    main {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #020617;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    /* ================= HEADER ================= */

    .lobby-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .lobby-header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .lobby-header p {
      color: #94a3b8;
      font-size: 16px;
    }

    /* ================= ACTIONS ================= */

    .lobby-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
      border-radius: 6px;
    }

    .btn-primary {
      background: #0ea5e9;
      color: white;
      padding: 12px 22px;
    }

    .btn-primary:hover {
      background: #0284c7;
    }

    .btn-secondary {
      background: #334155;
      color: white;
      padding: 12px 20px;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    #createRoomBtn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
    }

    /* ================= JOIN FORM ================= */

    .join-room-form {
      display: flex;
      gap: 10px;
    }

    .join-room-form input {
      width: 170px;
      padding: 11px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #020617;
      color: white;
      border: 1px solid #334155;
    }

    .join-room-form input:focus {
      border-color: #0ea5e9;
    }

    /* ================= PUBLIC ROOMS ================= */

    .public-rooms h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
      gap: 20px;
    }

    .room-card {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 18px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .room-card:hover {
      transform: translateY(-4px);
      border-color: #0ea5e9;
    }

    .room-card h3 {
      margin-bottom: 8px;
    }

    .room-card p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    /* ================= LOADING ================= */

    .loading-rooms {
      text-align: center;
      color: #94a3b8;
      grid-column: 1/-1;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #020617;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #1e293b;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      color: white;
      font-size: 24px;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #0ea5e9;
      outline: none;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 15px;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:600px){
      .lobby-actions{
        flex-direction: column;
      }

      .join-room-form{
        width:100%;
      }

      .join-room-form input{
        flex:1;
      }
    }

  </style>
</head>

<body>

<main>

  <section class="container">

    <!-- Header -->
    <div class="lobby-header">
      <h1>📚 Study Rooms</h1>
      <p>Join or create a collaborative study session</p>
    </div>

    <!-- Actions -->
    <div class="lobby-actions">

      <button id="createRoomBtn" class="btn-primary">
        <i class="fa-solid fa-plus"></i> Create Room
      </button>

      <div class="join-room-form">
        <input type="text" id="inviteCode" placeholder="Invite code">
        <button class="btn-secondary" id="joinBtn">Join</button>
      </div>

    </div>

    <!-- Public Rooms -->
    <div class="public-rooms">

      <h2>🌐 Public Rooms</h2>

      <div class="rooms-grid" id="roomsGrid">

        <div class="loading-rooms">
          Loading rooms...
        </div>

      </div>

    </div>

  </section>

</main>

<!-- Create Room Modal -->

<div class="modal" id="createModal">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Create Room</h2>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>

    <form id="createForm">

      <div class="form-group">
        <label>Room Name</label>
        <input type="text" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea rows="3"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>

    </form>

  </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

  const modal = document.getElementById("createModal");
  const openBtn = document.getElementById("createRoomBtn");
  const closeBtn = document.getElementById("closeModal");
  const cancelBtn = document.getElementById("cancelBtn");
  const grid = document.getElementById("roomsGrid");

  // Open modal
  openBtn.onclick = () => {
    modal.style.display = "flex";
  };

  // Close modal
  closeBtn.onclick = cancelBtn.onclick = () => {
    modal.style.display = "none";
  };

  // Fake rooms (demo)
  const rooms = [
    { name:"Web Dev Study", desc:"HTML & CSS practice" },
    { name:"DSA Group", desc:"Daily problem solving" },
    { name:"JS Bootcamp", desc:"Advanced JavaScript" },
    { name:"React Learners", desc:"React projects" }
  ];

  // Load rooms
  function loadRooms(){
    grid.innerHTML = "";

    rooms.forEach(room => {

      const card = document.createElement("div");
      card.className = "room-card";

      card.innerHTML = `
        <h3>${room.name}</h3>
        <p>${room.desc}</p>
        <button class="btn-primary">Join</button>
      `;

      grid.appendChild(card);

    });
  }

  // Load on start
  setTimeout(loadRooms, 800);

</script>

</body>
</html>
