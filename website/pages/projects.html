<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Archive | 100 Days of Web Dev</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    /* ========== RESET ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    /* ========== MAIN CONTAINER ========== */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 120px 20px 60px;
      text-align: center;
    }

    /* ========== HEADER ========== */
    .page-header {
      margin-bottom: 40px;
    }

    .page-header h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #ff7a18;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 122, 24, 0.5);
    }

    .page-header p {
      color: #ccc;
      font-size: 1.1rem;
    }

    /* ========== SEARCH BAR ========== */
    .search-wrapper {
      max-width: 500px;
      margin: 30px auto;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    .search-wrapper input:focus {
      border-color: #ff7a18;
      box-shadow: 0 0 10px #ff7a18;
    }

    /* ========== FILTER TABS ========== */
    .filter-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid #444;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab-btn:hover {
      border-color: #ff7a18;
      color: #fff;
    }

    .tab-btn.active {
      background: #ff7a18;
      color: #000;
      font-weight: bold;
      border-color: #ff7a18;
    }

    /* ========== PROJECT GRID ========== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    /* ========== PROJECT CARD ========== */
    .project-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 20px;
      text-align: left;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      min-height: 170px;
    }

    .project-card:hover {
      transform: translateY(-6px);
      border-color: #ff7a18;
      box-shadow: 0 0 15px rgba(255, 122, 24, 0.3);
    }

    .project-card h3 {
      color: #ff7a18;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .project-card p {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* ========== TECH TAGS ========== */
    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px; 
    }

    .tech-tag {
      background: #222;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* ========== FOOTER ========== */
    footer {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      color: #777;
      border-top: 1px solid #222;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 600px) {
      .page-header h1 {
        font-size: 2.2rem;
      }

      main {
        padding-top: 90px;
      }
    }
  </style>
</head>

<body>

  <!-- MAIN CONTENT -->
  <main>

    <!-- HEADER -->
    <div class="page-header">
      <h1>Projects Archive</h1>
      <p>Access all mission logs and deployment records</p>
    </div>

    <!-- SEARCH -->
    <div class="search-wrapper">
      <input
        type="text"
        id="projectSearch"
        placeholder="Search projects..."
      />
    </div>

    <!-- FILTER -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-cat="All">All</button>
      <button class="tab-btn" data-cat="Beginner">Beginner</button>
      <button class="tab-btn" data-cat="Intermediate">Intermediate</button>
      <button class="tab-btn" data-cat="Advanced">Advanced</button>
      <button class="tab-btn" data-cat="Capstone">Capstone</button>
    </div>

    <!-- GRID -->
    <div class="projects-grid" id="projectsGrid">
      <!-- Injected by JS -->
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    © 2026 | 100 Days of Web Development
  </footer>

  <!-- ========== JAVASCRIPT ========== -->
  <script>
    /* ========== SAMPLE PROJECT DATA ========== */
    const projects = [
      {
        title: "Portfolio Website",
        desc: "Personal responsive portfolio using HTML, CSS, and JS.",
        category: "Beginner",
        tech: ["HTML", "CSS", "JS"]
      },
      {
        title: "Weather App",
        desc: "Weather forecast app using API integration.",
        category: "Intermediate",
        tech: ["JS", "API", "CSS"]
      },
      {
        title: "Task Manager",
        desc: "Full CRUD task management system.",
        category: "Advanced",
        tech: ["React", "Firebase"]
      },
      {
        title: "E-learning Platform",
        desc: "Complete LMS with login and dashboard.",
        category: "Capstone",
        tech: ["MERN", "Auth"]
      }
    ];

    const grid = document.getElementById("projectsGrid");
    const searchInput = document.getElementById("projectSearch");
    const tabs = document.querySelectorAll(".tab-btn");

    let currentCategory = "All";

    /* ========== DISPLAY PROJECTS ========== */
    function renderProjects() {
      const search = searchInput.value.toLowerCase();

      grid.innerHTML = "";

      const filtered = projects.filter(p => {
        const matchCat =
          currentCategory === "All" || p.category === currentCategory;

        const matchSearch =
          p.title.toLowerCase().includes(search) ||
          p.desc.toLowerCase().includes(search);

        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "<p style='color:#777'>No projects found</p>";
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "project-card";

        card.innerHTML = `
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
          <div class="tech-stack">
            ${p.tech.map(t => `<span class="tech-tag">${t}</span>`).join("")}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    /* ========== SEARCH ========== */
    searchInput.addEventListener("input", renderProjects);

    /* ========== FILTER ========== */
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        currentCategory = tab.dataset.cat;
        renderProjects();
      });
    });

    /* ========== INIT ========== */
    renderProjects();
  </script>

</body>
</html>
