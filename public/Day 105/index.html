<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Form Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Quicksand:wght@600&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">FormBuilder Pro</div>

<div class="nav-links">
<a href="builder.html">Builder</a>
<a href="preview.html">Preview</a>
<a href="responses.html">Responses</a>
<a href="example.html">Example</a>
</div>

</div>


<!-- HERO -->

<section class="hero">

<h1>Advanced Form Builder</h1>
<p>Create powerful forms using drag & drop</p>

</section>


<!-- MAIN LAYOUT -->

<main class="layout">

<!-- LEFT SIDEBAR -->

<aside class="palette">

<h3>Field Types</h3>

<div class="palette-item" draggable="true" data-type="text">
<i class="fa fa-font"></i> Text
</div>

<div class="palette-item" draggable="true" data-type="email">
<i class="fa fa-envelope"></i> Email
</div>

<div class="palette-item" draggable="true" data-type="number">
<i class="fa fa-hashtag"></i> Number
</div>

<div class="palette-item" draggable="true" data-type="textarea">
<i class="fa fa-align-left"></i> Textarea
</div>

<div class="palette-item" draggable="true" data-type="radio">
<i class="fa fa-dot-circle"></i> Radio Group
</div>

<div class="palette-item" draggable="true" data-type="checkbox">
<i class="fa fa-check-square"></i> Checkbox Group
</div>

<div class="palette-item" draggable="true" data-type="select">
<i class="fa fa-list"></i> Dropdown
</div>

</aside>


<!-- FORM BUILDER -->

<section class="canvas" id="dropZone">

<div id="fields">

<p class="empty">
Drag fields from the left to build your form
</p>

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
