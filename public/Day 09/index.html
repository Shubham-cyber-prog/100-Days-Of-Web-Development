<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickNotes Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <h1>QuickNotes Pro</h1>
  <button class="toggle-btn" onclick="toggleTheme()">🌙</button>
</nav>

<div class="container">

  <div class="controls">
    <input type="text" id="noteText" placeholder="Write a note...">

    <select id="category">
      <option value="General">General</option>
      <option value="Work">Work</option>
      <option value="Study">Study</option>
      <option value="Personal">Personal</option>
    </select>

    <select id="color">
      <option value="#1e293b">Default</option>
      <option value="#f87171">Red</option>
      <option value="#34d399">Green</option>
      <option value="#60a5fa">Blue</option>
      <option value="#fbbf24">Yellow</option>
    </select>

    <button onclick="addNote()">Add Note</button>

    <input type="text" id="searchInput" placeholder="Search notes..." oninput="renderNotes()">
  </div>

  <div class="notes-grid" id="notesGrid"></div>

</div>

<script src="script.js"></script>
</body>
</html>
