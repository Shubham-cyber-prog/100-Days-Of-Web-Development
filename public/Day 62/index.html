<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Profile Dashboard</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>📊 GitHub Profile Dashboard</h1>

<div class="searchBox">
<input type="text" id="username" placeholder="Search GitHub users">
<button id="searchBtn">Search</button>
</div>

<button id="themeToggle">🌙</button>

</header>


<main>

<!-- SEARCH RESULTS -->
<section id="userResults" class="users"></section>


<!-- PROFILE -->
<section class="profile" id="profile"></section>


<!-- STATS -->
<section class="stats" id="stats"></section>


<!-- CHART -->
<section class="charts">
<h2>Languages Used</h2>
<canvas id="languageChart"></canvas>
</section>


<!-- REPOSITORIES -->
<section class="repos">

<h2>Top Repositories</h2>

<div id="repoList"></div>

</section>

</main>

<div id="loader">Loading...</div>

<script src="script.js"></script>

</body>
</html>
