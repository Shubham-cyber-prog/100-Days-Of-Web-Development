<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | 100 Days of Web Dev</title>
  <style>
    :root {
      --bg-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-core: #ff9d00;
      --accent-alpha: rgba(255, 157, 0, 0.3);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-4xl: 2.5rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .contact-wrapper {
      padding-top: 120px;
      padding-bottom: 60px;
      max-width: 650px;
      margin: 0 auto;
    }

    .form-glass {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 
        0 20px 60px -20px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-glass:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 24px 70px -20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 157, 0, 0.1) inset;
    }

    .text-center {
      text-align: center;
    }

    .mb-10 {
      margin-bottom: 40px;
    }

    h1 {
      font-size: var(--text-4xl);
      background: linear-gradient(135deg, #fff 0%, rgba(255, 157, 0, 0.9) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .text-secondary {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-core);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 3px rgba(255, 157, 0, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 140px;
      font-family: inherit;
    }

    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-core) 0%, #ff6b6b 100%);
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 157, 0, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .contact-wrapper {
        padding-top: 100px;
        padding-bottom: 40px;
      }

      .form-glass {
        padding: 32px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 2rem !important;
      }

      .form-input {
        padding: 12px 16px;
        font-size: 0.95rem;
      }

      .btn-primary {
        padding: 14px;
      }
    }

    @media (max-width: 480px) {
      .contact-wrapper {
        padding-top: 80px;
      }

      .form-glass {
        padding: 24px 20px;
      }

      h1 {
        font-size: 1.75rem !important;
      }

      .form-label {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="contact-wrapper">
      <div class="text-center mb-10">
        <h1>Establish Contact</h1>
        <p class="text-secondary">Send a transmission to the core team.</p>
      </div>

      <form class="form-glass">
        <div class="form-group">
          <label class="form-label">Identity</label>
          <input type="text" class="form-input" placeholder="Commander Name" required />
        </div>

        <div class="form-group">
          <label class="form-label">Coordinates (Email)</label>
          <input type="email" class="form-input" placeholder="user@domain.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Transmission</label>
          <textarea class="form-input" placeholder="Message content..." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Send Transmission 🚀</button>
      </form>
    </div>
  </main>
</body>
</html>
